<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land of Kaid — Interactive Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="css/style.css?v=27">
</head>
<body>

<div id="toolbar">
  <div id="title">Land of Kaid</div>

  <div id="search-wrap">
    <input id="search-box" type="text" placeholder="Search zones or markers..." autocomplete="off">
    <div id="search-results"></div>
  </div>

  <select id="layer-select"></select>

  <div id="filter-wrap"></div>

  <button id="dev-login-btn">Dev Login</button>
  <div id="dev-session-badge" class="hidden">
    <span id="dev-session-user"></span>
    <button id="dev-manage-btn" class="hidden">Manage Devs</button>
    <button id="dev-logout-btn">Logout</button>
  </div>
  <button id="dev-toggle" class="hidden" title="Toggle coordinate picker for adding markers/zones">Dev: Pick Coords</button>
</div>

<div id="map"></div>

<div id="control-box">
  <div id="control-box-header">
    <span>Controls</span>
    <button id="control-box-collapse-btn" title="Collapse/expand">▼</button>
  </div>
  <div id="control-box-body">
    <label class="control-label" for="zone-select">Jump to zone</label>
    <select id="zone-select">
      <option value="">Select a zone…</option>
    </select>

    <div class="control-label" style="margin-top:10px;">Amenity legend</div>
    <div id="amenity-legend"></div>
  </div>
</div>

<div id="zone-tier-panel" class="hidden">
  <div id="zone-tier-header">
    <span>Zone Tier Reference (temporary)</span>
    <button id="zone-tier-close">×</button>
  </div>
  <div id="zone-tier-body">
    <input id="zone-tier-search" type="text" placeholder="Filter zones..." autocomplete="off">
    <div id="zone-tier-list"></div>
  </div>
</div>

<div id="items-panel">
  <div id="items-header">
    <span>Items</span>
    <button id="items-collapse-btn" title="Collapse/expand">▼</button>
  </div>
  <div id="items-body">
    <div id="items-empty">Nothing here yet.</div>
  </div>
</div>

<div id="dev-panel" class="hidden">
  <div id="dev-header">
    <span>Coordinate Picker — click the map to log a point</span>
    <button id="zone-tier-toggle-btn">Zone Tier Reference</button>
    <button id="dev-copy-view-link">Copy Link to Current View</button>
    <button id="dev-clear">Clear</button>
    <button id="dev-close">×</button>
  </div>
  <div id="dev-recenter-row">
    <label for="dev-zone-target">Re-center zone on click</label>
    <select id="dev-zone-target">
      <option value="">— none, just log points —</option>
    </select>
    <span id="dev-recenter-status"></span>
    <button id="dev-export-zones">Copy Updated zones.js</button>
  </div>
  <div id="dev-tag-row">
    <label>Tag amenities — drag onto a room</label>
    <div id="dev-amenity-palette"></div>
    <span id="dev-tag-status"></span>
    <button id="dev-export-amenity-points">Copy Updated amenity-points.js</button>
  </div>
  <div id="dev-tier-row">
    <label>Trace tier path</label>
    <button id="trace-toggle-btn">Start Tracing</button>
    <button id="trace-undo-btn">Undo Point</button>
    <button id="trace-cancel-btn">Cancel</button>
    <button class="tier-tag-btn" data-tier="green" style="background:#4ade56">Save as Green</button>
    <button class="tier-tag-btn" data-tier="red" style="background:#d92b2b">Save as Red</button>
    <button class="tier-tag-btn" data-tier="purple" style="background:#9b59d6">Save as Purple</button>
    <span id="trace-status"></span>
    <button id="tier-export-btn">Copy Updated tier-paths.js</button>
  </div>
  <div id="dev-area-row">
    <label>Draw boundary area (white → tier)</label>
    <button id="area-toggle-btn">Start Area</button>
    <button id="area-undo-btn">Undo Point</button>
    <button id="area-cancel-btn">Cancel</button>
    <button class="area-tag-btn" data-tier="green" style="background:#4ade56">Save as Green</button>
    <button class="area-tag-btn" data-tier="red" style="background:#d92b2b">Save as Red</button>
    <button class="area-tag-btn" data-tier="purple" style="background:#9b59d6">Save as Purple</button>
    <span id="area-status"></span>
    <button id="area-export-btn">Copy Updated boundary-areas.js</button>
  </div>
  <div id="dev-body">
    <div id="dev-points"></div>
    <textarea id="dev-output" readonly placeholder="Clicked points will appear here as JSON..."></textarea>
  </div>
</div>

<div id="login-overlay" class="hidden">
  <div id="login-modal">
    <h3>Dev Login</h3>
    <label for="login-username">Username</label>
    <input id="login-username" type="text" autocomplete="username">
    <label for="login-password">Password</label>
    <input id="login-password" type="password" autocomplete="current-password">
    <div id="login-error"></div>
    <div id="login-buttons">
      <button id="login-submit">Log In</button>
      <button id="login-cancel">Cancel</button>
    </div>
  </div>
</div>

<div id="manage-overlay" class="hidden">
  <div id="manage-modal">
    <h3>Manage Dev Accounts</h3>
    <div id="manage-list"></div>
    <div id="manage-add">
      <input id="manage-new-username" type="text" placeholder="New username" autocomplete="off">
      <input id="manage-new-password" type="password" placeholder="New password" autocomplete="new-password">
      <button id="manage-add-btn">Add Account</button>
    </div>
    <div id="manage-error"></div>
    <div id="manage-buttons">
      <button id="manage-export-btn">Copy Updated dev-accounts.js</button>
      <button id="manage-close-btn">Close</button>
    </div>
  </div>
</div>

<div id="popup-template" class="hidden"></div>

<!--
  GitHub Pages caches these files for 10 minutes (Cache-Control: max-age=600),
  and browsers can hold onto them even longer. Bump the "?v=N" query string
  below on every push that changes css/style.css or any js/ file, so visitors
  always get the latest version instead of a stale cached copy.
-->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/data/layers.js?v=27"></script>
<script src="js/data/zones.js?v=27"></script>
<script src="js/data/markers.js?v=27"></script>
<script src="js/data/amenities.js?v=27"></script>
<script src="js/data/zone-amenities.js?v=27"></script>
<script src="js/data/amenity-points.js?v=27"></script>
<script src="js/data/tier-paths.js?v=27"></script>
<script src="js/data/boundary-areas.js?v=27"></script>
<script src="js/data/zone-items.js?v=27"></script>
<script src="js/data/dev-accounts.js?v=27"></script>
<script src="js/app.js?v=27"></script>
</body>
</html>
