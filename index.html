<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land of Kaid — Interactive Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="toolbar">
  <div id="title">Land of Kaid</div>

  <div id="search-wrap">
    <input id="search-box" type="text" placeholder="Search zones or markers..." autocomplete="off">
    <div id="search-results"></div>
  </div>

  <select id="layer-select"></select>

  <div id="filter-wrap"></div>

  <button id="dev-toggle" title="Toggle coordinate picker for adding markers/zones">Dev: Pick Coords</button>
</div>

<div id="map"></div>

<div id="control-box">
  <div id="control-box-header">Controls</div>
  <div id="control-box-body">
    <div id="control-box-empty">More controls coming soon.</div>
  </div>
</div>

<div id="dev-panel" class="hidden">
  <div id="dev-header">
    <span>Coordinate Picker — click the map to log a point</span>
    <button id="dev-copy-view-link">Copy Link to Current View</button>
    <button id="dev-clear">Clear</button>
    <button id="dev-close">×</button>
  </div>
  <div id="dev-body">
    <div id="dev-points"></div>
    <textarea id="dev-output" readonly placeholder="Clicked points will appear here as JSON..."></textarea>
  </div>
</div>

<div id="popup-template" class="hidden"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/data/layers.js"></script>
<script src="js/data/zones.js"></script>
<script src="js/data/markers.js"></script>
<script src="js/app.js"></script>
</body>
</html>
